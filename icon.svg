<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="tweed" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="20" height="20" fill="#7E6D5A"/>
      <path d="M0 0 L10 7 L20 0 M0 10 L10 17 L20 10" stroke="#66584A" stroke-width="2.4" fill="none"/>
      <path d="M0 5 L10 12 L20 5" stroke="#948370" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="tweedFonce" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#5E5143"/>
      <path d="M0 0 L8 6 L16 0 M0 8 L8 14 L16 8" stroke="#4A3F34" stroke-width="2" fill="none"/>
    </pattern>
    <radialGradient id="doublure" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#6E4A2E"/>
      <stop offset="1" stop-color="#3B2A1D"/>
    </radialGradient>
  <clipPath id="dedans"><path d="M0 0 L512 0 L512 252 L428 252 A160 40 0 0 1 108 252 L0 252 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#F6EEDC"/>
  <g transform="translate(256 268) scale(1.04) translate(-258 -300)">
    <!-- ombre -->
    <ellipse cx="262" cy="398" rx="170" ry="18" fill="#2B2118" opacity=".13"/>
    <!-- calotte retournée -->
    <g transform="translate(0 600) scale(1 -1)">
      <path d="M424 358 C452 342 458 270 416 246 C352 214 254 234 172 274 C130 294 102 316 110 336 C126 350 160 352 200 354 Z"
            fill="url(#tweed)" stroke="#3E342A" stroke-width="5" stroke-linejoin="round"/>
      <path d="M120 326 C176 298 262 266 356 250" fill="none" stroke="#3E342A" stroke-width="4" stroke-linecap="round" opacity=".6"/>
      <circle cx="140" cy="318" r="7" fill="#4A3F34"/>
    </g>
    <!-- visière : un croissant posé à plat contre le bord avant de l'ouverture -->
    <path d="M150 225 C94 219 44 234 38 255 C44 276 94 290 150 279 A160 40 0 0 1 150 225 Z"
          fill="url(#tweedFonce)" stroke="#3E342A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M140 234 C104 234 76 244 70 254" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <!-- ouverture : l'intérieur doublé -->
    <ellipse cx="268" cy="252" rx="160" ry="40" fill="url(#doublure)" stroke="#3E342A" stroke-width="5"/>
    <g clip-path="url(#dedans)" stroke="#9C7A45" stroke-width="4" stroke-linejoin="round">
      <g transform="translate(318 244) rotate(16)"><rect x="-40" y="-26" width="80" height="52" rx="4" fill="#DDBB7E"/><line x1="0" y1="-26" x2="0" y2="26" stroke-dasharray="7 6" stroke-width="3"/></g>
      <g transform="translate(232 240) rotate(-14)"><rect x="-44" y="-28" width="88" height="56" rx="4" fill="#E7C98F"/><line x1="0" y1="-28" x2="0" y2="28" stroke-dasharray="7 6" stroke-width="3"/></g>
      <g transform="translate(284 262) rotate(4)"><rect x="-36" y="-23" width="72" height="46" rx="4" fill="#E7C98F"/><line x1="0" y1="-23" x2="0" y2="23" stroke-dasharray="6 5" stroke-width="3"/></g>
      <g transform="translate(372 250) rotate(34)"><rect x="-28" y="-18" width="56" height="36" rx="4" fill="#DDBB7E"/><line x1="0" y1="-18" x2="0" y2="18" stroke-dasharray="6 5" stroke-width="3"/></g>
    </g>
    <path d="M108 252 A160 40 0 0 0 428 252" fill="none" stroke="#3E342A" stroke-width="5"/>
  </g>
</svg>
